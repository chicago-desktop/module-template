organization: windows
module: module-template
description: A module of the Windows 95 shell (windows/shell) made from the Windows module template — one sample window on the shell SDK, with its tests and its image pack.
license: MIT
repository: https://github.com/wippy-windows/module-template
homepage: https://wippy.ai
keywords:
  - kickside
  - tui
  - terminal
  - desktop
  - windows
# No `version:` here — the publisher picks it (`wippy publish` bumps the
# latest published one). A published version is immutable.
exclude_meta:
  type:
    - test
exclude:
  - "wippy.lock"
  - "app:**"
  - "app.env:**"
  - "test/**"
  - "test:**"
  - ".wippy/**"
  - ".wippy:**"
# `wippy publish` packs the entries of src/ and embeds only the fs.directory
# entries named here (they become fs.embed in the package). The image pack
# lies outside src/, so without this line the published module has no
# pictures. Add every pack and asset directory your module declares.
embed:
  - windows.module_template:images
